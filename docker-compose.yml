services:
  db-permissions:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - ./prisma:/data
    command: sh -c "mkdir -p /data && chown -R 1001:1001 /data && chmod -R u+rwX,g+rwX /data"

  web:
    build:
      context: .
      target: web
    depends_on:
      db-permissions:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma

  worker:
    build:
      context: .
      target: worker
    depends_on:
      db-permissions:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npm run worker:start"
